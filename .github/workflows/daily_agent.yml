name: Daily Global Sector & Stock AI Agent

on:
  schedule:
    # 매일 아침 08:00 KST (UTC 기준 전날 23:00) 자동 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # GitHub 웹에서 언제든 수동 실행 버튼 클릭 가능

permissions:
  contents: write

jobs:
  run-daily-agent:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 한국 시간(KST) 타임존 설정 및 글로벌 파이프라인 & 노션 발행 실행
        env:
          TZ: Asia/Seoul
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python global_pipeline.py
          python notion_publisher.py

      # 야후는 '지금'의 컨센서스만 주므로 매일 받아 data/snapshots/에 쌓는다 (API 키 필요 없음).
      # 실패해도 아래 리포트 갱신은 계속한다.
      - name: 4-2. 컨센서스·목표가 날짜별 기록
        continue-on-error: true
        env:
          TZ: Asia/Seoul
        run: python snapshot_daily.py

      # 신호 기록 장부: 매매 틀 v2(틀 A) 판정을 매일 data/ledger/에 쌓는다 (컨센서스 기록 다음 — 같은 날 추정치 건수를 씀)
      - name: 4-3. 매매 틀 판정 기록 (신호 기록 장부)
        continue-on-error: true
        env:
          TZ: Asia/Seoul
        run: python ledger_daily.py

      - name: 5. 최신 리포트 JSON과 컨센서스 기록을 저장소에 자동 Commit & Push (Streamlit 대시보드 자동 갱신용)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add latest_global_report.json
          if ls data/snapshots/consensus_*.csv >/dev/null 2>&1; then git add data/snapshots/consensus_*.csv; fi
          if ls data/ledger/frame_a_*.csv >/dev/null 2>&1; then git add data/ledger/frame_a_*.csv; fi
          git diff --staged --quiet || git commit -m "chore: auto-update daily global report [skip ci]"
          git push
